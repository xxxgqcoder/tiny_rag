services:
  minio:
    image: minio/minio:latest
    container_name: tiny_rag_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - tiny_rag_minio_data:/data
    networks:
      - tiny_rag

  redis:
    image: redis:latest
    container_name: tiny_rag_redis
    ports:
      - "6379:6379"
    volumes:
      - tiny_rag_redis_data:/data
    networks:
      - tiny_rag

  tiny_rag:
    image: tiny_rag:dev
    container_name: tiny_rag
    ports:
      - "8080:8080"
    environment:
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - tiny_rag_data:/var/data/tiny_rag
    depends_on:
      - minio
      - redis
    networks:
      - tiny_rag
    
volumes:
  tiny_rag_data:
    driver: local
  tiny_rag_minio_data:
    driver: local
  tiny_rag_redis_data:
    driver: local

networks:
  tiny_rag:
    driver: bridge
